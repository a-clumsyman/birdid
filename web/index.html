<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe4cb">
<title>Bird ID · field notebook</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="scene" aria-hidden="true"></div>
    <div class="topbar">
      <div class="brand">Field Notes</div>
      <button id="avatarBtn" class="avatar" aria-label="Profile"></button>
    </div>
    <div class="hello"><h1 id="helloH" class="serif"></h1><p id="helloP" class="hand"></p></div>
  </header>
  <main id="main">
    <section id="v-auth" class="view"></section>

    <section id="v-listen" class="view">
      <div class="modes" id="modes" role="tablist">
        <button data-mode="catch" class="on" role="tab">Catch it<small>mic stays on, grab the last 30 s</small></button>
        <button data-mode="record" role="tab">Record<small>tap to start, tap to stop</small></button>
      </div>
      <div id="stage">
        <div class="tape"><canvas id="tape" width="720" height="120"></canvas><span id="tapeLbl" class="mono"></span></div>
        <button id="mainBtn" class="mainbtn"><span id="mainIcon"></span><span id="mainLbl">Start listening</span></button>
        <button id="stopLink" class="linkbtn" hidden>Stop listening</button>
        <p id="stageNote" class="hand note"></p>
        <p id="recMeta" class="mono small"></p>
      </div>
      <div id="review" hidden></div>
      <div id="recent"></div>
    </section>

    <section id="v-log" class="view">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search species or place">
        <button id="favFilter" class="chip" aria-pressed="false">★ Starred</button>
        <button id="exportBtn" class="chip">CSV</button>
      </div>
      <div id="logList"></div>
    </section>
    <section id="v-life" class="view"><div id="lifeList"></div></section>
    <section id="v-map" class="view"><div id="map"></div><p id="mapEmpty" class="hand note"></p></section>
  </main>
  <nav id="tabs">
    <button data-tab="listen" class="on"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 00-4 4v5a4 4 0 008 0V7a4 4 0 00-4-4zM5 11a7 7 0 0014 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Listen</button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 012 2v14a2 2 0 01-2 2H6zM6 3v18M10 8h6M10 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Notebook</button>
    <button data-tab="life"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Checklist</button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.100 7-11.500A7 7 0 005 9.500C5 14.900 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.500" r="2.500" fill="currentColor"/></svg>Atlas</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card"><button id="sheetClose" class="x" aria-label="Close">×</button><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_cHJlc2VudC1jb25kb3ItMzUyMC5jbGVyay5hY2NvdW50cy5kZXYk" src="https://present-condor-3520.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
<script src="config.js"></script>
<script src="dsp.js"></script>
<script src="app.js"></script>
</body>
</html>
