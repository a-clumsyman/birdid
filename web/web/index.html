<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecdc">
<title>Bird ID</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top"><div class="brand"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M26 8c-1.6 0-2.9.7-3.8 1.8C20.6 7.7 18.4 6 15.6 6 11.4 6 8 9.4 8 13.6c0 1.2.3 2.4.8 3.4L4 22.4l5.1-.9c1.9 2.6 5 4.3 8.4 4.3 6 0 10.5-4.700 10.500-10.800V10l2-1.500L26 8zm-3.600 4.600a1.100 1.100 0 110 2.200 1.100 1.100 0 010-2.200z"/></svg><span>Bird ID</span></div><button id="avatarBtn" class="avatar" aria-label="Profile"></button></header>
  <main id="main">
    <section id="v-auth" class="view"></section>
    <section id="v-record" class="view">
      <div class="rec-wrap">
        <p id="recHint" class="hint">Tap, then hold still. Ten seconds is plenty.</p>
        <button id="recBtn" class="rec" aria-label="Record 10 seconds">
          <canvas id="wave" width="560" height="560"></canvas>
          <span id="recLabel">Record</span>
        </button>
        <p id="recStatus" class="status"></p>
        <div id="recMeta" class="meta"></div>
      </div>
      <div id="result"></div>
      <div id="recent"></div>
    </section>
    <section id="v-log" class="view">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search species or place">
        <button id="favFilter" class="chip" aria-pressed="false">★ Favourites</button>
        <button id="exportBtn" class="chip">Export CSV</button>
      </div>
      <div id="logList"></div>
    </section>
    <section id="v-life" class="view"><div id="lifeList"></div></section>
    <section id="v-map" class="view"><div id="map"></div><p id="mapEmpty" class="hint"></p></section>
  </main>
  <nav id="tabs">
    <button data-tab="record" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Record</button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>Log</button>
    <button data-tab="life"><svg viewBox="0 0 24 24"><path d="M12 3l2.400 5.800 6.100.5-4.700 4 1.500 6L12 16l-5.300 3.300 1.500-6-4.700-4 6.100-.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Life list</button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.100 7-11.500A7 7 0 005 9.500C5 14.900 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.500" r="2.500" fill="currentColor"/></svg>Map</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card"><button id="sheetClose" class="x" aria-label="Close">×</button><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
